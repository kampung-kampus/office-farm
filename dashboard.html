<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Dashboard</title>

<style>

body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
}

.header {
  background: #2c7a3f;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.controls {
  padding: 10px;
  background: white;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

input, select {
  padding: 8px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

#downloadBtn {
  display: block;
  padding: 8px 16px;
  background: #2c7a3f;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
  min-height: 36px;
}

#downloadBtn:hover {
  background: #256d35;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

.alert {
  border-left: 6px solid red;
}

.plot {
  font-weight: bold;
  font-size: 18px;
  color: #2c7a3f;
}

.empty {
  background: #7f8c8d;
}

.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 15px;
  color: white;
  font-size: 12px;
  margin-top: 5px;
}

.growing { background: #2ecc71; }
.soon    { background: #f39c12; }
.ready   { background: #e74c3c; }
.weeding { background: #9b59b6; }

.small {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
}

.card img {
  width: 100%;
  border-radius: 8px;
  margin-top: 8px;
}

.task-summary {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: 10px;
  font-weight: bold;
}

.task-summary span {
  background: #eee;
  padding: 5px 10px;
  border-radius: 15px;
  font-size: 12px;
}

.emoji {
  font-size: 2em;
}


/* style for phone */
@media only screen and (max-width: 600px) {
  .controls {
    flex-direction: column !important;
    align-items: stretch !important;
    overflow: visible !important;
  }

  .controls input,
  .controls select,
  .controls button {
    display: block !important;
    width: 100% !important;
    box-sizing: border-box !important;
    visibility: visible !important;
    opacity: 1 !important;
    min-height: 36px !important;
  }

  .task-summary {
    flex-wrap: wrap;
    margin-left: 0;
    width: 100%;
  }

  /* 👇 2 columns on mobile = 6 cards visible per screen */
  .grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
    padding: 8px !important;
  }

  .card {
    padding: 8px !important;
  }

  .plot {
    font-size: 13px !important;
  }

  .card img {
    display: none !important;
  }

  .small {
    font-size: 11px !important;
  }

  .status {
    font-size: 10px !important;
    padding: 3px 6px !important;
  }

  .emoji {
    font-size: 1em !important;
  }
}

</style>
</head>

<body>

<div class="header">🌿GUI Farm Management System and Plot-by-Plot Veggie Guide</div>

<div class="controls">

  <input type="text" id="search" placeholder="Search plot or plant...">
 
  <a href="farm-map.html" style="display:inline-block; padding:8px 16px; background:#2c7a3f; color:white; border-radius:5px; text-decoration:none; font-size:14px; min-height:36px; line-height:20px;">🗺️ Map of the Farm</a>

<a href="noticeboard.html" style="display:inline-block; padding:8px 16px; background:#2c7a3f; color:white; border-radius:5px; text-decoration:none; font-size:14px;">📋 Notice Board</a>

<!-- New codes added for Next week's harvest button -->
<button onclick="showNextWeekHarvest()"
  style="padding:8px 16px; background:#e67e22; color:white;
  border:none; border-radius:5px; cursor:pointer;
  font-size:14px; min-height:36px;">
  📅 Next Week's Harvest
</button>


  
<a href="#" onclick="openHarvesting()"
   style="display:inline-block; padding:8px 16px;
   background:#2c7a3f; color:white;
   border-radius:5px; text-decoration:none;
   font-size:14px;">
   🌾 Harvesting Data
</a>

  
  <button id="downloadBtn" onclick="downloadCSVFromSheet()">
    📥 Download Full History
  </button> 




  <select id="filter">
    <option value="all">All</option>
    <option value="ready">Harvest Ready</option>
    <option value="soon">Manuring Soon</option>
    <option value="weeding">Weeding Needed</option>
    <option value="empty">Empty</option>
  </select>

  <select id="sort">
    <option value="none">Sort: Default</option>
    <option value="urgent">Sort: Urgency</option>
  </select>

  <div class="task-summary">
    <span id="taskHarvest">🔴 0 Harvest Ready</span>
    <span id="taskManure">🟡 0 Manure Today</span>
    <span id="taskWeeding">🟣 0 Weeding Needed</span>
  </div>

</div>

<div class="grid" id="grid"></div>

<script>

const DATA_URL = "https://kampung-kampus.github.io/office-farm/data/farm.json?v=" + new Date().getTime();

let farmData = {};


function getStatus(data) {
  const today = new Date();

  if (!data.plant || data.plant.trim() === "" || data.plant.toLowerCase() === "empty") {
    return { text: "Empty Plot", class: "empty", priority: 0 };
  }

  const harvest = new Date(data.estHarvest  + "T00:00:00");
  const manure  = new Date(data.nextManure  + "T00:00:00");
  const weeding = new Date(data.nextWeeding + "T00:00:00");

  const harvestDiff = Math.floor((harvest - today) / (1000 * 60 * 60 * 24));
  const manureDiff  = Math.floor((manure  - today) / (1000 * 60 * 60 * 24));
  const weedDiff    = Math.floor((weeding - today) / (1000 * 60 * 60 * 24));

  if (harvestDiff <= 0)  return { text: "Harvest Ready",      class: "ready",   priority: 1 };
  if (manureDiff  <= 0)  return { text: "Ready for Manuring", class: "soon",    priority: 2 };
  if (manureDiff  <= 3)  return { text: "Manuring Soon",      class: "soon",    priority: 3 };
  if (weedDiff    <= 0)  return { text: "Weeding Needed",     class: "weeding", priority: 4 };

  return { text: "No Action Needed", class: "growing", priority: 5 };
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let items = Object.keys(farmData).map(k => ({ plot: k, ...farmData[k] }));

  const search = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;
  const sort   = document.getElementById("sort").value;

  items = items.filter(item => {
    const status = getStatus(item);
    if (search &&
        !item.plot.toLowerCase().includes(search) &&
        !item.plant.toLowerCase().includes(search)) return false;
    if (filter !== "all" && status.class !== filter) return false;
    return true;
  });

  updateTaskSummary(items);

  if (sort === "urgent") {
    items.sort((a, b) => getStatus(a).priority - getStatus(b).priority);
  }

  items.forEach(item => {
    const status = getStatus(item);
    const card = document.createElement("div");
    card.className = "card";
    if (status.priority <= 2) card.classList.add("alert");
    card.onclick = () => { window.location.href = "index.html?plot=" + item.plot; };

    card.innerHTML = `
      <div class="plot">${item.plot}</div>
      <div>${item.plant}</div>
      <div class="status ${status.class}">${status.text}</div>
      <div class="small"><span class="emoji">👨‍🌾</span> ${item.staff}</div>
      <div class="small"><span class="emoji">📅</span>${item.datePlanted}</div>
      <div class="small"><span class="emoji">🌾</span>${item.estHarvest}</div>
      <img src="${item.images[0]}" onerror="this.style.display='none'">
      <div style="text-align:center; font-size:11px; color:#aaa; margin-top:6px;">👆 Tap for details</div>
    `;

    grid.appendChild(card);
  });
}

function updateTaskSummary(items) {
  let harvest = 0, manure = 0, weeding = 0;
  items.forEach(item => {
    const s = getStatus(item);
    if (s.class === "ready")   harvest++;
    if (s.class === "soon")    manure++;
    if (s.class === "weeding") weeding++;
  });
  document.getElementById("taskHarvest").innerText = "🔴 " + harvest + " Harvest Ready";
  document.getElementById("taskManure").innerText  = "🟡 " + manure  + " Manure Today";
  document.getElementById("taskWeeding").innerText = "🟣 " + weeding + " Weeding Needed";
}



 // New codes added  for Next week harvest from this line to line 450 //
  function showNextWeekHarvest() {

  // ── Work out next Monday and next Sunday ──
  const today  = new Date();
  const todayDay = today.getDay(); // 0=Sun, 1=Mon, ... 6=Sat

  // Days until next Monday
  const daysToNextMonday = todayDay === 0 ? 1 : 8 - todayDay;

  const nextMonday = new Date(today);
  nextMonday.setDate(today.getDate() + daysToNextMonday);
  nextMonday.setHours(0, 0, 0, 0);

  const nextSunday = new Date(nextMonday);
  nextSunday.setDate(nextMonday.getDate() + 6);
  nextSunday.setHours(23, 59, 59, 999);

  // ── Format dates for display ──
  const opts = { day: 'numeric', month: 'short', year: 'numeric' };
  const mondayStr = nextMonday.toLocaleDateString('en-SG', opts);
  const sundayStr = nextSunday.toLocaleDateString('en-SG', opts);

  document.getElementById('harvestWeekLabel').innerHTML =
    '🗓️ Showing harvests due: <strong>' + mondayStr + ' — ' + sundayStr + '</strong>';

  // ── Find matching crops ──
  const results = [];

  Object.values(farmData).forEach(item => {
    if (!item.estHarvest) return;
    if (!item.plant || item.plant.toLowerCase() === 'empty') return;

    const harvestDate = new Date(item.estHarvest + 'T00:00:00');

    if (harvestDate >= nextMonday && harvestDate <= nextSunday) {
      results.push(item);
    }
  });

  // ── Sort by harvest date ──
  results.sort((a, b) => new Date(a.estHarvest) - new Date(b.estHarvest));

  // ── Build content ──
  const container = document.getElementById('harvestModalContent');

  if (results.length === 0) {
    container.innerHTML = `
      <div style="text-align:center; padding:32px; color:#aaa;">
        <div style="font-size:3rem; margin-bottom:12px;">🌱</div>
        <p style="font-size:14px;">No crops due for harvest next week.</p>
      </div>`;
  } else {
    container.innerHTML = results.map(item => {
      const harvestDate = new Date(item.estHarvest + 'T00:00:00');
      const dayName = harvestDate.toLocaleDateString('en-SG', { weekday: 'long' });
      const dateStr = harvestDate.toLocaleDateString('en-SG', {
        day: 'numeric', month: 'short', year: 'numeric'
      });

      return `
        <div style="border:1px solid #e0e0e0; border-radius:10px;
          padding:14px 16px; margin-bottom:10px;
          border-left:5px solid #2c7a3f;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:bold; font-size:16px; color:#2c7a3f;">
                ${item.plot}
              </div>
              <div style="font-size:14px; margin-top:2px;">🌿 ${item.plant}</div>
              <div style="font-size:12px; color:#888; margin-top:4px;">
                👨‍🌾 ${item.staff}
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:13px; font-weight:bold; color:#e67e22;">
                ${dayName}
              </div>
              <div style="font-size:12px; color:#888; margin-top:2px;">
                📅 ${dateStr}
              </div>
            </div>
          </div>
        </div>`;
    }).join('');

    // Add summary count at top
    container.innerHTML =
      `<div style="text-align:center; background:#eafaf1; border-radius:8px;
        padding:10px; margin-bottom:14px; font-size:14px; color:#2c7a3f;">
        🌾 <strong>${results.length}</strong> crop${results.length > 1 ? 's' : ''} ready for harvest next week
      </div>` + container.innerHTML;
  }

  // ── Show modal ──
  document.getElementById('harvestModal').style.display = 'flex';
}

function closeHarvestModal() {
  document.getElementById('harvestModal').style.display = 'none';
}

  
function openHarvesting() {
  const entered = prompt("Enter password to access Harvesting Data:");

  if (entered === "g") {
    window.location.href = "harvesting.html";
  } else if (entered !== null) {
    alert("Incorrect password.");
  }
}


function downloadCSVFromSheet() {
  document.getElementById('pwModal').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

function confirmDownload() {
  const entered = document.getElementById('pwInput').value;
  const correct = 'g'; // 🔑 Change password here anytime
  if (entered === correct) {
    document.getElementById('pwModal').style.display = 'none';
    const url = "https://script.google.com/macros/s/AKfycbzAjwlVpIiVdYrQeg261RXfe6p-enuInmlu3Wjo4B9uQEGIXgrIA0pAoFkCswRVBMdGoQ/exec?type=csv&v=" + new Date().getTime();
    window.open(url, "_blank");
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function cancelDownload() {
  document.getElementById('pwModal').style.display = 'none';
}



 


 

async function load() {
  const res = await fetch(DATA_URL);
  farmData = await res.json();
  render();
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);

load();

</script>





<!--New codes added for  Next Week Harvest Modal -->
<div id="harvestModal" style="display:none; position:fixed; top:0; left:0;
  width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;
  align-items:center; justify-content:center;">
  <div style="background:white; border-radius:12px; padding:28px;
    width:90%; max-width:500px; max-height:80vh; overflow-y:auto;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0; color:#2c7a3f;">📅 Next Week's Harvest</h3>
      <button onclick="closeHarvestModal()"
        style="background:none; border:none; font-size:20px;
        cursor:pointer; color:#888;">✕</button>
    </div>

    <div id="harvestWeekLabel"
      style="font-size:13px; color:#666; margin-bottom:16px; text-align:center;">
    </div>

    <div id="harvestModalContent"></div>

  </div>
</div>



  
<!-- Password Modal -->
<div id="pwModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:12px; padding:32px; width:90%; max-width:360px;
    box-shadow:0 8px 32px rgba(0,0,0,0.2); text-align:center;">
    <div style="font-size:36px; margin-bottom:12px;">🔒</div>
    <h3 style="margin:0 0 8px; color:#2c7a3f;">Protected Download</h3>
    <p style="color:#666; font-size:13px; margin-bottom:20px;">Enter password to download Full History</p>
    <input type="password" id="pwInput" placeholder="Enter password"
      onkeydown="if(event.key==='Enter') confirmDownload()"
      style="width:100%; padding:10px 14px; border:1.5px solid #ccc; border-radius:8px;
        font-size:14px; box-sizing:border-box; margin-bottom:10px; outline:none;">
    <div id="pwError" style="display:none; color:#c0392b; font-size:13px;
      margin-bottom:10px;">❌ Incorrect password. Try again.</div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="cancelDownload()"
        style="padding:10px 20px; border:1.5px solid #ccc; background:white;
          border-radius:8px; cursor:pointer; font-size:14px; color:#666;">
        Cancel
      </button>
      <button onclick="confirmDownload()"
        style="padding:10px 20px; background:#2c7a3f; color:white;
          border:none; border-radius:8px; cursor:pointer; font-size:14px;">
        Download
      </button>
    </div>
  </div>
</div>
</body>
</html>
