<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map of the Farm — Office Farm</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-deep:   #0f1f0f;
      --green-dark:   #1a2e1a;
      --green-accent: #4a7c2f;
      --green-light:  #7ab648;
      --cream:        #f5f0e8;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--green-deep);
      color: var(--cream);
    }

    /* ── Topbar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 56px;
      background: linear-gradient(90deg, var(--green-deep), var(--green-dark));
      border-bottom: 1px solid rgba(122,182,72,0.2);
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }
    .topbar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; color: var(--cream); white-space: nowrap;
    }
    .topbar-logo span { color: var(--green-light); }
    .nav-menu {
      display: flex; gap: 6px; align-items: center;
      overflow-x: auto; flex: 1; scrollbar-width: none;
    }
    .nav-menu::-webkit-scrollbar { display: none; }
    .nav-pill {
      padding: 6px 14px; border-radius: 20px; font-size: 0.78rem;
      font-weight: 500; white-space: nowrap; cursor: pointer;
      border: 1px solid rgba(122,182,72,0.25);
      background: rgba(255,255,255,0.04);
      color: rgba(245,240,232,0.6);
      transition: all 0.2s; text-decoration: none;
    }
    .nav-pill:hover { background: rgba(122,182,72,0.12); color: var(--cream); }
    .nav-pill.active {
      background: var(--green-accent);
      border-color: var(--green-accent); color: #fff;
    }

    /* ── Map image area ── */
    .map-container {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-deep);
      overflow: auto;
    }

    .map-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    /* Loading state */
    .loading {
      position: absolute;
      color: rgba(245,240,232,0.4);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 700px) {
      .nav-pill { font-size: 0.7rem; padding: 5px 10px; }
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-logo">GUI<span>Farm</span></div>
  <nav class="nav-menu">
    <a href="dashboard.html" class="nav-pill">🏠 Dashboard</a>
    <a href="farm-map.html" class="nav-pill active">🗺️ Map of the Farm</a>
    <a href="noticeboard.html" class="nav-pill">📋 Notice Board</a>
    <a href="harvesting.html" class="nav-pill">🌾 Harvesting Data</a>
  </nav>
</div>

<!-- Map image -->
<div class="map-container">
  <div class="loading" id="loading">🌿 Loading map...</div>
  <img
    src="https://kampung-kampus.github.io/office-farm/images/mapofthefarm1.pdf"
    alt="Map of the Farm"
    id="farmMap"
    style="display:none;"
    onload="document.getElementById('loading').style.display='none'; this.style.display='block';"
    onerror="document.getElementById('loading').innerText='⚠️ Map image not found. Please check the image file in your images folder.';"
  />
</div>

</body>
</html>
