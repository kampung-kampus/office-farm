<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map of the Farm — Office Farm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --green-deep: #0f1f0f; --green-dark: #1a2e1a; --green-mid: #2d5016; --green-accent: #4a7c2f; --green-light: #7ab648; --gold: #c8a84b; --cream: #f5f0e8; --white: #ffffff; --sidebar-w: 300px; }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--green-deep); color: var(--cream); }
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 56px; background: linear-gradient(90deg, var(--green-deep), var(--green-dark)); border-bottom: 1px solid rgba(122,182,72,0.2); display: flex; align-items: center; gap: 16px; padding: 0 20px; box-shadow: 0 2px 20px rgba(0,0,0,0.4); }
    .topbar-logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--cream); white-space: nowrap; }
    .topbar-logo span { color: var(--green-light); }
    .nav-menu { display: flex; gap: 6px; align-items: center; overflow-x: auto; flex: 1; scrollbar-width: none; }
    .nav-menu::-webkit-scrollbar { display: none; }
    .nav-pill { padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; cursor: pointer; border: 1px solid rgba(122,182,72,0.25); background: rgba(255,255,255,0.04); color: rgba(245,240,232,0.6); transition: all 0.2s; text-decoration: none; }
    .nav-pill:hover { background: rgba(122,182,72,0.12); color: var(--cream); }
    .nav-pill.active { background: var(--green-accent); border-color: var(--green-accent); color: #fff; box-shadow: 0 2px 12px rgba(74,124,47,0.4); }
    .layout { display: flex; height: 100vh; padding-top: 56px; }
    .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: linear-gradient(180deg, var(--green-dark) 0%, #111e11 100%); border-right: 1px solid rgba(122,182,72,0.15); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid rgba(122,182,72,0.1); }
    .sidebar-title { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--cream); margin-bottom: 4px; }
    .sidebar-sub { font-size: 0.72rem; color: rgba(245,240,232,0.4); letter-spacing: 0.06em; text-transform: uppercase; }
    .search-wrap { padding: 12px 16px; border-bottom: 1px solid rgba(122,182,72,0.1); }
    .search-input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(122,182,72,0.2); border-radius: 8px; color: var(--cream); font-size: 0.82rem; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    .search-input::placeholder { color: rgba(245,240,232,0.3); }
    .search-input:focus { border-color: var(--green-accent); }
    .plot-list { flex: 1; overflow-y: auto; padding: 8px 0; scrollbar-width: thin; scrollbar-color: rgba(122,182,72,0.3) transparent; }
    .plot-group-label { padding: 10px 16px 4px; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(245,240,232,0.3); }
    .plot-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; transition: background 0.15s; border-left: 3px solid transparent; }
    .plot-item:hover { background: rgba(122,182,72,0.08); }
    .plot-item.selected { background: rgba(122,182,72,0.12); border-left-color: var(--green-accent); }
    .plot-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .plot-info { flex: 1; min-width: 0; }
    .plot-name { font-size: 0.85rem; font-weight: 500; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plot-meta { font-size: 0.72rem; color: rgba(245,240,232,0.4); }
    .plot-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 10px; background: rgba(255,255,255,0.07); color: rgba(245,240,232,0.5); white-space: nowrap; }
    .legend { padding: 12px 16px; border-top: 1px solid rgba(122,182,72,0.1); }
    .legend-title { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,240,232,0.3); margin-bottom: 8px; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 6px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: rgba(245,240,232,0.6); }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-content-wrapper { background: var(--green-dark) !important; border: 1px solid rgba(122,182,72,0.3) !important; border-radius: 12px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important; color: var(--cream) !important; }
    .leaflet-popup-tip { background: var(--green-dark) !important; }
    .leaflet-popup-content { margin: 14px 16px !important; }
    .popup-title { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--green-light); margin-bottom: 8px; }
    .popup-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 3px 0; border-bottom: 1px solid rgba(122,182,72,0.1); color: rgba(245,240,232,0.8); }
    .popup-row:last-child { border-bottom: none; }
    .popup-row span:first-child { color: rgba(245,240,232,0.45); }
    .map-stats { position: absolute; top: 12px; right: 12px; z-index: 500; background: rgba(15,31,15,0.88); backdrop-filter: blur(12px); border: 1px solid rgba(122,182,72,0.2); border-radius: 12px; padding: 12px 16px; min-width: 160px; }
    .map-stat { margin-bottom: 6px; }
    .map-stat:last-child { margin-bottom: 0; }
    .map-stat-val { font-size: 1.3rem; font-weight: 500; color: var(--green-light); line-height: 1; }
    .map-stat-label { font-size: 0.68rem; color: rgba(245,240,232,0.4); letter-spacing: 0.06em; text-transform: uppercase; }
    .sidebar-toggle { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 600; width: 44px; height: 44px; border-radius: 50%; background: var(--green-accent); border: none; cursor: pointer; color: white; font-size: 1.2rem; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    @media (max-width: 700px) { .sidebar { position: fixed; top: 56px; left: 0; bottom: 0; z-index: 400; transform: translateX(-100%); transition: transform 0.3s ease; } .sidebar.open { transform: translateX(0); } .sidebar-toggle { display: flex; align-items: center; justify-content: center; } .nav-pill { font-size: 0.7rem; padding: 5px 10px; } }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">Office<span>Farm</span></div>
  <nav class="nav-menu">
    <a href="dashboard.html" class="nav-pill">🏠 Dashboard</a>
    <a href="#" class="nav-pill">🔍 Search</a>
    <a href="#" class="nav-pill">📥 Download Full History</a>
    <a href="farm-map.html" class="nav-pill active">🗺️ Map of the Farm</a>
    <a href="#" class="nav-pill">📊 Reports</a>
    <a href="#" class="nav-pill">⚙️ Settings</a>
  </nav>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Farm Plots</div>
      <div class="sidebar-sub">Click a plot to locate it</div>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="text" id="plotSearch" placeholder="Search plant or plot..." oninput="filterPlots()" />
    </div>
    <div class="plot-list" id="plotList"></div>
    <div class="legend">
      <div class="legend-title">Plant Types</div>
      <div class="legend-items" id="legend"></div>
    </div>
  </aside>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-stats">
      <div class="map-stat"><div class="map-stat-val" id="statPlots">0</div><div class="map-stat-label">Total Plots</div></div>
      <div class="map-stat"><div class="map-stat-val" id="statTypes">0</div><div class="map-stat-label">Plant Types</div></div>
      <div class="map-stat"><div class="map-stat-val" id="statArea">0</div><div class="map-stat-label">Total Area (m²)</div></div>
    </div>
  </div>
</div>
<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
<script>
const FARM_CENTER = [1.416083, 103.829000];
const FARM_ZOOM = 18;
const PLANT_COLORS = { 'Leafy Greens':'#7ab648','Herbs':'#c8a84b','Fruiting':'#e07b3a','Root Crops':'#8b6b3d','Legumes':'#5ba3c9','Flowers':'#c96b9a' };
const plots = [
  { id:1,  plot:'A-01', plant:'Kai Lan',      type:'Leafy Greens', area:25, status:'Growing',   planted:'Jan 2025', harvest:'Mar 2025', notes:'Batch 3',        lat:1.41620, lng:103.82905 },
  { id:2,  plot:'A-02', plant:'Spinach',       type:'Leafy Greens', area:20, status:'Ready',     planted:'Dec 2024', harvest:'Feb 2025', notes:'Ready to pick',  lat:1.41615, lng:103.82915 },
  { id:3,  plot:'A-03', plant:'Lettuce',       type:'Leafy Greens', area:18, status:'Seedling',  planted:'Feb 2025', harvest:'Apr 2025', notes:'New batch',      lat:1.41610, lng:103.82925 },
  { id:4,  plot:'B-01', plant:'Basil',         type:'Herbs',        area:12, status:'Growing',   planted:'Jan 2025', harvest:'Mar 2025', notes:'Thai & Sweet',   lat:1.41605, lng:103.82900 },
  { id:5,  plot:'B-02', plant:'Lemongrass',    type:'Herbs',        area:30, status:'Growing',   planted:'Oct 2024', harvest:'Ongoing',  notes:'Perennial',      lat:1.41600, lng:103.82910 },
  { id:6,  plot:'B-03', plant:'Pandan',        type:'Herbs',        area:15, status:'Growing',   planted:'Sep 2024', harvest:'Ongoing',  notes:'Perennial',      lat:1.41595, lng:103.82920 },
  { id:7,  plot:'C-01', plant:'Tomato',        type:'Fruiting',     area:35, status:'Flowering', planted:'Dec 2024', harvest:'Mar 2025', notes:'Cherry variety', lat:1.41590, lng:103.82905 },
  { id:8,  plot:'C-02', plant:'Chilli',        type:'Fruiting',     area:20, status:'Growing',   planted:'Jan 2025', harvest:'Apr 2025', notes:'Bird eye',       lat:1.41585, lng:103.82915 },
  { id:9,  plot:'C-03', plant:'Cucumber',      type:'Fruiting',     area:40, status:'Growing',   planted:'Jan 2025', harvest:'Mar 2025', notes:'Trellis grown',  lat:1.41580, lng:103.82925 },
  { id:10, plot:'D-01', plant:'Sweet Potato',  type:'Root Crops',   area:50, status:'Growing',   planted:'Nov 2024', harvest:'May 2025', notes:'Purple variety', lat:1.41575, lng:103.82900 },
  { id:11, plot:'D-02', plant:'Yam Bean',      type:'Root Crops',   area:45, status:'Growing',   planted:'Oct 2024', harvest:'Apr 2025', notes:'Row 1-3',        lat:1.41570, lng:103.82910 },
  { id:12, plot:'E-01', plant:'Long Bean',     type:'Legumes',      area:28, status:'Ready',     planted:'Dec 2024', harvest:'Feb 2025', notes:'Trellis',        lat:1.41565, lng:103.82905 },
  { id:13, plot:'E-02', plant:'Winged Bean',   type:'Legumes',      area:22, status:'Growing',   planted:'Jan 2025', harvest:'Apr 2025', notes:'Experimental',   lat:1.41560, lng:103.82915 },
  { id:14, plot:'F-01', plant:'Marigold',      type:'Flowers',      area:15, status:'Blooming',  planted:'Nov 2024', harvest:'Ongoing',  notes:'Pest control',   lat:1.41555, lng:103.82905 },
  { id:15, plot:'F-02', plant:'Butterfly Pea', type:'Flowers',      area:10, status:'Blooming',  planted:'Dec 2024', harvest:'Ongoing',  notes:'Border plant',   lat:1.41550, lng:103.82915 },
];
const map = L.map('map', { zoomControl: true }).setView(FARM_CENTER, FARM_ZOOM);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>', maxZoom: 22 }).addTo(map);
const markers = {};
function makeIcon(color) {
  return L.divIcon({ className: '', html: `<div style="width:32px;height:32px;border-radius:50% 50% 50% 0;background:${color};border:3px solid rgba(255,255,255,0.9);transform:rotate(-45deg);box-shadow:0 3px 10px rgba(0,0,0,0.4);"></div>`, iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-32] });
}
plots.forEach(p => {
  const color = PLANT_COLORS[p.type] || '#7ab648';
  const marker = L.marker([p.lat, p.lng], { icon: makeIcon(color) }).addTo(map).bindPopup(`<div class="popup-title">Plot ${p.plot} — ${p.plant}</div><div class="popup-row"><span>Type</span><span>${p.type}</span></div><div class="popup-row"><span>Status</span><span>${p.status}</span></div><div class="popup-row"><span>Area</span><span>${p.area} m²</span></div><div class="popup-row"><span>Planted</span><span>${p.planted}</span></div><div class="popup-row"><span>Harvest</span><span>${p.harvest}</span></div><div class="popup-row"><span>Notes</span><span>${p.notes}</span></div>`);
  markers[p.id] = marker;
});
const types = [...new Set(plots.map(p => p.type))];
const totalArea = plots.reduce((s, p) => s + p.area, 0);
document.getElementById('statPlots').textContent = plots.length;
document.getElementById('statTypes').textContent = types.length;
document.getElementById('statArea').textContent = totalArea;
function renderPlots(data) {
  const list = document.getElementById('plotList');
  const groups = {};
  data.forEach(p => { const g = p.plot.split('-')[0]; if (!groups[g]) groups[g] = []; groups[g].push(p); });
  list.innerHTML = '';
  Object.entries(groups).forEach(([grp, items]) => {
    const label = document.createElement('div'); label.className = 'plot-group-label'; label.textContent = `Zone ${grp}`; list.appendChild(label);
    items.forEach(p => {
      const color = PLANT_COLORS[p.type] || '#7ab648';
      const item = document.createElement('div'); item.className = 'plot-item'; item.id = `plot-${p.id}`;
      item.innerHTML = `<div class="plot-dot" style="background:${color}"></div><div class="plot-info"><div class="plot-name">${p.plant}</div><div class="plot-meta">Plot ${p.plot} · ${p.area}m²</div></div><div class="plot-badge">${p.status}</div>`;
      item.addEventListener('click', () => selectPlot(p)); list.appendChild(item);
    });
  });
}
function selectPlot(p) {
  document.querySelectorAll('.plot-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`plot-${p.id}`); if (el) el.classList.add('selected');
  map.flyTo([p.lat, p.lng], 19, { duration: 1.2 }); markers[p.id].openPopup();
  if (window.innerWidth <= 700) document.getElementById('sidebar').classList.remove('open');
}
function filterPlots() {
  const q = document.getElementById('plotSearch').value.toLowerCase();
  renderPlots(plots.filter(p => p.plant.toLowerCase().includes(q) || p.plot.toLowerCase().includes(q) || p.type.toLowerCase().includes(q) || p.status.toLowerCase().includes(q)));
}
const legend = document.getElementById('legend');
Object.entries(PLANT_COLORS).forEach(([name, color]) => { const item = document.createElement('div'); item.className = 'legend-item'; item.innerHTML = `<div class="legend-dot" style="background:${color}"></div>${name}`; legend.appendChild(item); });
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
renderPlots(plots);
</script>
</body>
</html>
